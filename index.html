<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- calculator-container -->
    <div class="calculator-container">

        <!-- screen-container -->
        <div class="screen-container">
            <!-- notch -->
            <div class="notch"></div>

            <!-- scree-header -->
            <div class="screen-header">
                <button class="pill-btn">History</button>
                <button class="pill-btn">Scientific</button>
            </div>
            <div id="history" class="history-display"></div>
            <div id="result" class="result-display">0</div>
        </div>

        <!-- keypads -->
        <div class="keypads">
            <button class="btn-light" onclick="clearAll()">AC</button>
            <button class="btn-light" onclick="toggleSign()">+/-</button>
            <button class="btn-light" onclick="appendOperator('%')">%</button>
            <button class="btn-blue" onclick="appendOperator('/')">/</button>

            <button class="btn-light" onclick="appendNumber('7')">7</button>
            <button class="btn-light" onclick="appendNumber('8')">8</button>
            <button class="btn-light" onclick="appendNumber('9')">9</button>
            <button class="btn-blue" onclick="appendOperator('*')">×</button>

            <button class="btn-light" onclick="appendNumber('4')">4</button>
            <button class="btn-light" onclick="appendNumber('5')">5</button>
            <button class="btn-light" onclick="appendNumber('6')">6</button>
            <button class="btn-blue" onclick="appendOperator('+')">+</button>

            <button class="btn-light" onclick="appendNumber('1')">1</button>
            <button class="btn-light" onclick="appendNumber('2')">2</button>
            <button class="btn-light" onclick="appendNumber('3')">3</button>
            <button class="btn-blue" onclick="appendOperator('-')">-</button>

            <button class="btn-light btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn-light" onclick="appendDecimal('.')">.</button>
            <button class="btn-blue" onclick="calculate()">=</button>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
