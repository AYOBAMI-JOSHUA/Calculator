<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- calculator-container -->
    <div class="calculator-container">

        <!-- screen-container -->
        <div class="screen-container">
            <!-- notch -->
            <div class="notch"></div>

            <!-- scree-header -->
            <div class="screen-header">
                <button class="pill-btn">History</button>
                <button class="pill-btn">Scientific</button>
            </div>
            <div class="history-display"></div>
            <div class="result-display"></div>
        </div>

        <!-- keypads -->
        <div class="keypads">
            <button class="btn-light">AC</button>
            <button class="btn-light"></button>
            <button class="btn-light">%</button>
            <button class="btn-blue">/</button>

            <button class="btn-light">7</button>
            <button class="btn-light">8</button>
            <button class="btn-light">9</button>
            <button class="btn-blue"></button>

            <button class="btn-light">4</button>
            <button class="btn-light">5</button>
            <button class="btn-light">6</button>
            <button class="btn-blue">+</button>

            <button class="btn-light">1</button>
            <button class="btn-light">2</button>
            <button class="btn-light">3</button>
            <button class="btn-blue">.</button>
            
            <button class="btn-light btn-zero">0</button>
            <button class="btn-light">.</button>
            <button class="btn-blue">=</button>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
